<!DOCTYPE html>
<html>
<head>
    <title>Scan QR Absensi</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            font-family: Segoe UI, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dfe9f3;
            overflow: hidden;
        }

        /* BACKGROUND */

        .bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(30px);

            box-shadow:
                inset 0 0 60px rgba(255,255,255,0.7),
                0 0 80px rgba(255,255,255,0.25);
        }

        .orb1 {
            width: 520px;
            height: 520px;
            top: -120px;
            right: -120px;

            background:
                radial-gradient(circle at 40% 40%,
                rgba(255,255,255,0.9),
                rgba(130,170,255,0.6),
                rgba(255,160,220,0.5),
                rgba(255,200,140,0.3),
                transparent 70%);
        }

        .orb2 {
            width: 420px;
            height: 420px;
            left: -120px;
            top: 120px;

            background:
                radial-gradient(circle at 50% 50%,
                rgba(255,255,255,0.9),
                rgba(160,220,255,0.5),
                rgba(200,200,255,0.4),
                transparent 70%);
        }

        .orb3 {
            width: 260px;
            height: 260px;
            bottom: -60px;
            right: 260px;

            background:
                radial-gradient(circle at 40% 60%,
                rgba(255,255,255,0.9),
                rgba(120,255,200,0.6),
                rgba(140,180,255,0.4),
                transparent 70%);
        }

        /* CARD */

        .card {
            position: relative;
            z-index: 2;
            width: 380px;
            padding: 35px;
            border-radius: 22px;

            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(40px);

            border: 1px solid rgba(255,255,255,0.6);

            box-shadow: 0 30px 60px rgba(0,0,0,0.15);

            text-align: center;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3b6cff;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #274bdb;
        }

        #reader {
            width: 100%;
            margin-top: 15px;
            display: none;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }

        .success {
            background-color: #2ecc71;
            color: white;
        }

        .error {
            background-color: #e74c3c;
            color: white;
        }

        .loading {
            background-color: #f1c40f;
            color: black;
        }

        #resetBtn {
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

<!-- Background -->
<div class="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<!-- Card -->
<div class="card">

    <h2>Scan QR Absensi</h2>

    <input type="text" id="user_id" placeholder="Masukkan User ID">

    <button onclick="startScan()">Absen Sekarang</button>

    <div id="reader"></div>

    <div id="statusBox" class="status"></div>

    <button id="resetBtn" onclick="resetScan()">Scan Lagi</button>

</div>

<script>
const BASE_URL = "https://semilyric-stanton-semioval.ngrok-free.dev/cloud-presensi-versib-e62c9/us-central1/api";

let html5QrCode;

function showStatus(message, type) {
  const box = document.getElementById("statusBox");
  box.innerText = message;
  box.className = "status " + type;
  box.style.display = "block";
}

function startScan() {
  const user_id = document.getElementById("user_id").value.trim();

  if (!user_id) {
    showStatus("❌ Masukkan User ID dulu!", "error");
    return;
  }

  document.getElementById("reader").style.display = "block";
  document.getElementById("statusBox").style.display = "none";
  document.getElementById("resetBtn").style.display = "none";

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  );
}

function onScanSuccess(decodedText) {
  html5QrCode.stop();
  document.getElementById("reader").style.display = "none";

  showStatus("⏳ Memproses check-in...", "loading");

  checkin(decodedText);
}

async function checkin(qr_token) {
  const user_id = document.getElementById("user_id").value;

  try {
    const res = await fetch(`${BASE_URL}/presence/checkin`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id,
        qr_token
      })
    });

    const data = await res.json();

    if (data.ok) {
      showStatus("✅ Check-in Berhasil!", "success");
    } else {
      showStatus("❌ " + data.message, "error");
    }

  } catch (err) {
    showStatus("❌ Gagal koneksi ke server", "error");
  }

  document.getElementById("resetBtn").style.display = "inline-block";
}

function resetScan() {
  document.getElementById("statusBox").style.display = "none";
  document.getElementById("resetBtn").style.display = "none";
  document.getElementById("reader").style.display = "none";
}
</script>

</body>
</html>
